# Tests every push / pull request. Pushing a version tag (v8.4, v9.0, …) also
# builds RemoteTerminal-<version>.exe and publishes it on GitHub Releases.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Go tests
        run: go test ./...

      - name: Type-check frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit

      - name: Build executable
        shell: pwsh
        run: ./build.ps1

      - name: Release notes from README
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          $row = Select-String -Path README.md -Pattern ('^\| \*\*' + [regex]::Escape($v) + '\*\* \|') | Select-Object -First 1
          $notes = if ($row) { ($row.Line -split '\|')[3].Trim() } else { 'See the version history in README.md.' }
          @"
          ## Remote Terminal $v

          $notes

          **Download:** ``RemoteTerminal-$v.exe`` below — a single portable file, no installation. Requires Windows 10/11 (WebView2 is preinstalled).

          Full history: [README → Version history](https://github.com/${{ github.repository }}#version-history)
          "@ | Set-Content -Encoding utf8 release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Remote Terminal ${{ github.ref_name }}
          body_path: release-notes.md
          files: build/bin/RemoteTerminal-*.exe

      - name: Keep the build as an artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: RemoteTerminal-exe
          path: build/bin/RemoteTerminal-*.exe
          retention-days: 14
