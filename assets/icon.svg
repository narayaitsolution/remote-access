<svg id="icon" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Remote Terminal: a terminal window whose prompt ends in a wireless
       signal instead of a cursor (">" + signal = remote shell). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <!-- app tile -->
  <rect x="32" y="32" width="960" height="960" rx="210" fill="url(#bg)"/>
  <!-- terminal window -->
  <rect x="132" y="196" width="760" height="632" rx="76" fill="url(#scr)" stroke="#e0f2fe" stroke-opacity=".35" stroke-width="10"/>
  <path d="M208 196 H816 A76 76 0 0 1 892 272 V306 H132 V272 A76 76 0 0 1 208 196 Z" fill="#1e293b"/>
  <circle cx="212" cy="252" r="21" fill="#f87171"/><circle cx="276" cy="252" r="21" fill="#fbbf24"/><circle cx="340" cy="252" r="21" fill="#4ade80"/>
  <!-- prompt ">" -->
  <path d="M236 430 L386 540 L236 650" fill="none" stroke="#4ade80" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- wireless signal in place of the cursor -->
  <circle cx="640" cy="690" r="46" fill="#ffffff"/>
  <path d="M552 602 A124 124 0 0 1 728 602" fill="none" stroke="#ffffff" stroke-width="56" stroke-linecap="round"/>
  <path d="M478 528 A228 228 0 0 1 802 528" fill="none" stroke="#7dd3fc" stroke-width="56" stroke-linecap="round"/>
</svg>
